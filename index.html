<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<title>Quản lý chi tiêu</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--text:#18202f;--muted:#6a7488;--border:#e4e8f1;--primary:#4f6df5;--primary2:#8b5cf6;--ok:#16a34a;--warn:#d97706;--bad:#e11d48;--shadow:0 1px 2px rgba(20,30,60,.05),0 6px 20px rgba(20,30,60,.06);--r:16px;--nav-h:64px}
html[data-theme=dark]{--bg:#0e1320;--card:#171e2e;--text:#e9edf7;--muted:#93a0ba;--border:#263049;--primary:#7b93ff;--primary2:#a78bfa;--ok:#4ade80;--warn:#fbbf24;--bad:#fb7185;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h2,h3{margin:0}
.muted{color:var(--muted)}.small{font-size:13px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}

input,select,textarea{width:100%;min-width:0;min-height:44px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--card);font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,109,245,.18)}
textarea{resize:vertical;min-height:70px}
input[type=date],input[type=time],input[type=month]{-webkit-appearance:none;appearance:none;text-align:left}
input[type=color]{padding:3px;width:44px;min-height:36px;height:36px;border-radius:10px;cursor:pointer}
.lab{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:var(--card);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:grid;place-items:center;font-weight:800}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);background:var(--card);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);padding:4px 0;cursor:pointer;min-width:0}
.nav .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav button.active{color:var(--primary);font-weight:700}
.nav .add .plus{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 16px rgba(79,109,245,.4)}

main{max-width:1040px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 44px + env(safe-area-inset-bottom))}
.page-h h2{margin:4px 0 12px;font-size:22px}

.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.stat .l{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .v{font-size:clamp(17px,4.8vw,22px);font-weight:800;margin-top:6px;overflow-wrap:anywhere}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat.hero{grid-column:span 2;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:0}
.stat.hero .l,.stat.hero .s{color:rgba(255,255,255,.85)}
.stat.hero .v{font-size:clamp(24px,7vw,32px)}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-top:14px}
.panel h3{font-size:16px;margin-bottom:12px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.ph h3{margin:0}
.grid2{display:grid;gap:0 14px}

.chart{min-height:120px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-size:10.5px;fill:var(--muted)}
.chart .grid line{stroke:var(--border);stroke-dasharray:3 4}
.chart .col{cursor:pointer}
.chart .bar{fill:var(--primary);opacity:.88;transition:opacity .15s}
.chart .col:hover .bar{opacity:1}
.chart .bar.hl{fill:var(--primary2)}
.chart .line{fill:none;stroke:var(--primary);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--card);stroke:var(--primary);stroke-width:2}
.chart .col:hover .dot{fill:var(--primary)}
.donut-wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:center}
.donut-wrap>svg{width:180px;height:180px;flex:none}
.donut-wrap .legend{flex:1;min-width:240px}
.slice{cursor:pointer;transition:stroke-width .15s}.slice:hover{stroke-width:31}
.dn-l{font-size:11px;fill:var(--muted)}.dn-v{font-size:15px;font-weight:800;fill:var(--text)}
.leg{display:grid;grid-template-columns:12px 1fr auto 46px;gap:8px;align-items:center;width:100%;border:0;background:none;padding:8px 4px;text-align:left;cursor:pointer;border-radius:10px}
.leg:hover{background:var(--bg)}
.leg i{width:12px;height:12px;border-radius:4px;display:block}
.leg .ln{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg .lv{font-weight:700;white-space:nowrap}.leg .lp{color:var(--muted);font-size:12.5px;text-align:right}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:9px 6px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--primary);color:#fff}
.seg.mini{width:150px}.seg.mini button{padding:6px}

.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);font-weight:600;cursor:pointer}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:0}
.btn.danger{background:var(--bad);color:#fff;border:0}
.btn.ghost-danger{color:var(--bad);border-color:var(--bad)}
.btn.more{width:100%;margin-top:12px}
.btns{display:flex;gap:10px;margin-top:18px}.btns .btn{flex:1}
.link{background:none;border:0;color:var(--primary);font-weight:600;cursor:pointer;padding:8px 0}
.icon-btn{width:36px;height:36px;border:0;background:none;border-radius:10px;color:var(--muted);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--bg);color:var(--text)}.icon-btn.danger:hover{color:var(--bad)}

.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.item:last-child{border-bottom:0}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:none;position:relative;isolation:isolate}
.ic::before,.chip::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--c);opacity:.18;z-index:-1}
.im{flex:1;min-width:0}
.it{font-weight:600;overflow-wrap:anywhere}
.is{color:var(--muted);font-size:12.5px}
.in{color:var(--muted);font-size:12.5px;font-style:italic;overflow-wrap:anywhere}
.ir{text-align:right;flex:none}
.ia{font-weight:800;white-space:nowrap}
.ib{display:flex;gap:2px;justify-content:flex-end;margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:28px 12px}.empty.small{padding:16px}
.gh{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:13px;color:var(--muted);padding:16px 4px 0;margin-bottom:-6px}
.gh+.panel{margin-top:8px}

.filters .search{position:relative}
.filters .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.filters .search input{padding-left:40px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.fl{font-size:12px;color:var(--muted);display:block;min-width:0}.fl input{margin-top:4px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.pill{border:1px solid var(--border);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:600;color:var(--muted)}
.sumline{margin:14px 4px 0;color:var(--muted)}.sumline b{color:var(--text)}

.navbar{display:flex;gap:8px;align-items:center;margin-top:12px}
.navbar .mid{flex:1;display:flex;gap:8px;min-width:0}
.navbar .icon-btn{background:var(--card);border:1px solid var(--border);width:44px;height:44px}
.nb-sub{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 0;font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.tile.full{grid-column:1/-1}
.tl{font-size:12.5px;color:var(--muted)}
.tv{font-size:clamp(16px,4.6vw,21px);font-weight:800;margin-top:4px;overflow-wrap:anywhere}
.ts{font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.cmp{font-weight:700;margin-top:4px}.cmp .muted{font-weight:400}

.bp{margin-bottom:16px}.bp:last-child{margin-bottom:0}
.bp-h{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:14px;flex-wrap:wrap}
.track{height:10px;background:var(--border);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--ok);transition:width .3s}
.fill.l1{background:var(--warn)}.fill.l2{background:var(--bad)}
.bp-f{font-size:12.5px;margin-top:5px}
.alert{padding:12px 14px;border-radius:12px;margin-bottom:10px;font-size:14px;border-left:4px solid var(--warn);background:rgba(245,158,11,.14)}
.alert.l2{border-left-color:var(--bad);background:rgba(225,29,72,.12)}

.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.row:last-of-type{border-bottom:0}.row .grow{flex:1;min-width:0}.row .grow b{overflow-wrap:anywhere}
.money{position:relative}.money input{padding-right:36px}
.money span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;pointer-events:none}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dgrid .full{grid-column:1/-1}

.overlay{position:fixed;inset:0;z-index:100;background:rgba(10,15,30,.5);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.overlay.show{opacity:1}.overlay.center{align-items:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(24px);transition:transform .2s;overscroll-behavior:contain}
.overlay.show .sheet{transform:none}
.sheet.small{max-width:400px;border-radius:20px;margin:16px;width:calc(100% - 32px)}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
.sh-head h3{font-size:18px;overflow-wrap:anywhere}
.money.big input{font-size:28px;font-weight:800;min-height:56px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;isolation:isolate;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:14px}
.chip::before{opacity:0}.chip.on{border-color:var(--c);font-weight:700}.chip.on::before{opacity:.2}
.err{color:var(--bad);font-size:13.5px;min-height:18px;margin-top:10px}
.emojis{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.emo{width:38px;height:38px;border:1px solid var(--border);background:var(--card);border-radius:10px;font-size:20px;cursor:pointer}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--border);cursor:pointer}
.sw.on{box-shadow:0 0 0 2.5px var(--text)}

/* ===== Ví ===== */
.nav .ext{display:none}
.stat.hero.neg{background:linear-gradient(135deg,#e11d48,#f97316)}
.stat.hero.low{background:linear-gradient(135deg,#d97706,#f59e0b)}
.cards .stat.hero.full{grid-column:1/-1}
.stat.hero .v.big{font-size:clamp(28px,9vw,40px);letter-spacing:-.5px}
.stat.hero .sub2{font-size:12.5px;margin-top:6px;color:rgba(255,255,255,.9)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.qa .btn{min-height:54px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px}
.qa .btn b{font-size:26px;line-height:1;font-weight:600}
.btn.inc{background:#15803d;color:#fff;border:0}
.btn.exp{background:#e11d48;color:#fff;border:0}
.tb{position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;border-radius:50%;color:#fff;font-size:13px;font-weight:800;line-height:14px;text-align:center;border:2px solid var(--card);box-sizing:border-box}
.tb.in{background:#15803d}.tb.out{background:#e11d48}
.lg{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin:0 0 8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.chart .bar.in{fill:var(--ok)}
.chart .bar.out{fill:var(--bad)}
.chart .zero{stroke:var(--muted);opacity:.55}
.chart .area{fill:var(--primary);opacity:.12}
.pt .r{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px;font-size:14px}
.pt .r b{text-align:right;overflow-wrap:anywhere}
.alert .link{padding:0}
.navbar .mid select,.navbar .mid input{padding-left:10px;padding-right:6px;font-size:15px}
/* ===== Đa ví ===== */
.wgrid{display:grid;gap:12px;grid-template-columns:1fr;margin-top:12px}
.wcard{background:var(--card);border:1px solid var(--border);border-left:5px solid var(--c);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);cursor:pointer;min-width:0;display:block;text-align:left}
.wcard:hover,.wcard:focus-visible{border-color:var(--c);outline:none}
.wcard .top{display:flex;align-items:center;gap:10px;min-width:0}
.wcard .nm{min-width:0;flex:1}
.wcard .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcard .bal{font-size:clamp(20px,6vw,26px);font-weight:800;margin-top:10px;overflow-wrap:anywhere}
.wcard .sub{font-size:12.5px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.wcard.dim{opacity:.7}
.qa3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.qa3 .btn{min-height:48px;padding:0 6px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px;text-align:center;line-height:1.2}
.btn.tfb{background:#4f6df5;color:#fff;border:0}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mrow .btn{min-height:40px;padding:0 12px;font-size:14px}
.stat.hero.wh{background:linear-gradient(135deg,rgba(255,255,255,0),rgba(0,0,0,.34)),var(--c)}
.stat.hero.wh.neg{background:linear-gradient(135deg,#e11d48,#f97316)}
.stat.hero.wh.low{background:linear-gradient(135deg,#d97706,#f59e0b)}
.wh-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-width:0}
.wh-top>div:last-child{min-width:0;overflow-wrap:anywhere}
.wh-top .ic::before{background:#fff;opacity:.25}
.ia.tfc,.tfc{color:var(--primary)}
.tb.tf{background:#6366f1;font-size:10px}
.chk{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer}
.chk:last-of-type{border-bottom:0}
.chk input,.rad input{width:22px;height:22px;min-height:0;flex:none;padding:0;accent-color:var(--primary)}
.chk .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.rad{display:flex;gap:10px;align-items:flex-start;padding:10px 0 4px;cursor:pointer;font-weight:600}
.rad input{margin-top:1px}
.seg.sm button{font-size:13px;padding:9px 2px}
.row.click{cursor:pointer}
.row.click:hover{background:var(--bg)}
.backrow{margin:2px 0 6px}
.wnote{font-size:12.5px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.total-line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700;padding:10px 4px 0}
.navbar .mid select,.navbar .mid input{padding-left:10px;padding-right:6px;font-size:15px}
@media(min-width:700px){.wgrid{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.wgrid{grid-template-columns:repeat(3,1fr)}}

.wfam{grid-column:1/-1;display:flex;flex-direction:column;gap:10px}
.wkids{display:grid;grid-template-columns:1fr;gap:10px;margin-left:14px;padding-left:12px;border-left:3px solid var(--border)}
@media(min-width:700px){.wkids{grid-template-columns:1fr 1fr}}
.wcard.kid{padding:12px}
.row.kid{padding-left:26px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom));transform:translate(-50%,16px);z-index:300;background:#1f2937;color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;max-width:min(92vw,420px);white-space:pre-line;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 8px 24px rgba(0,0,0,.3);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:#b45309}.toast.bad{background:#be123c}

@media(min-width:700px){
 .overlay{align-items:center}.sheet{border-radius:22px}
 .grid2{grid-template-columns:1fr 1fr}
}
@media(min-width:860px){
 body{padding-left:230px}
 .nav{top:57px;bottom:0;right:auto;width:230px;grid-template-columns:1fr;grid-auto-rows:min-content;align-content:start;gap:4px;padding:16px 12px;border-top:0;border-right:1px solid var(--border)}
 .nav button{flex-direction:row;gap:12px;font-size:15px;padding:12px 14px;border-radius:12px;justify-content:flex-start}
 .nav button.active{background:rgba(79,109,245,.12)}
 .nav .add{order:-1;margin-bottom:10px;background:linear-gradient(135deg,var(--primary),var(--primary2))!important;color:#fff!important;justify-content:center!important}
 .nav .add .plus{width:22px;height:22px;margin:0;background:none;box-shadow:none}
 .topbar{position:fixed;left:0;right:0;top:0}
 main{padding-top:80px;padding-bottom:40px}
 .cards{grid-template-columns:repeat(4,1fr)}
 .tiles{grid-template-columns:repeat(4,1fr)}
 .cards.c3{grid-template-columns:repeat(3,1fr)}
 .cards.c3 .span2{grid-column:auto}
 .nav .ext{display:inline}
 .toast{bottom:24px}
}
</style>
</head>
<body>
<header class="topbar">
 <div class="brand"><div class="logo">₫</div><span>Chi tiêu của tôi</span></div>
 <button class="icon-btn" id="theme-btn" data-act="theme-toggle" aria-label="Đổi giao diện sáng/tối"></button>
</header>
<nav class="nav" id="nav"></nav>
<main id="view"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-import" accept=".json,application/json" hidden>
<noscript><p style="padding:20px">Ứng dụng cần bật JavaScript để hoạt động.</p></noscript>

<script>
(function(){
'use strict';

/* ================= Tiện ích ================= */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const todayStr=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);};

function cleanCats(arr){
 const seen=new Set(),cats=[];
 arr.forEach(c=>{
  if(!c||typeof c.name!=='string'||!c.name.trim())return;
  let id=typeof c.id==='string'?c.id.replace(/[^\w-]/g,''):'';
  if(!id||seen.has(id))id=uid();
  seen.add(id);
  cats.push({id:id,name:c.name.trim().slice(0,40),icon:(typeof c.icon==='string'&&c.icon.trim())?c.icon.trim().slice(0,8):'📦',color:/^#[0-9a-f]{6}$/i.test(c.color)?c.color:'#64748b'});
 });
 return cats;
}
const cleanId=(v,seen)=>{let id=typeof v==='string'?v.replace(/[^\w-]/g,''):'';if(!id||seen.has(id))id=uid();seen.add(id);return id;};

function sanitize(raw){
 const s=defaults();
 if(!raw||typeof raw!=='object')return s;
 if(Array.isArray(raw.categories))s.categories=cleanCats(raw.categories);
 if(Array.isArray(raw.incomeCats))s.incomeCats=cleanCats(raw.incomeCats);
 if(Array.isArray(raw.walletTypes))s.walletTypes=cleanCats(raw.walletTypes);
 /* Ví: dữ liệu cũ (chưa có nhiều ví) được chuyển vào một ví mặc định, số dư ban đầu cũ được giữ lại */
 let migrated=true;
 if(Array.isArray(raw.wallets)){
  const seenW=new Set(),ws=[];
  raw.wallets.forEach(w=>{
   if(!w||typeof w.name!=='string'||!w.name.trim())return;
   const o=Math.round(Number(w.opening));
   ws.push({id:cleanId(w.id,seenW),name:w.name.trim().slice(0,40),type:typeof w.type==='string'?w.type:'',parent:typeof w.parent==='string'?w.parent:'',opening:(isFinite(o)&&o>0&&o<=1e13)?o:0,color:/^#[0-9a-f]{6}$/i.test(w.color)?w.color:'#4f6df5',icon:(typeof w.icon==='string'&&w.icon.trim())?w.icon.trim().slice(0,8):'👛',desc:typeof w.desc==='string'?w.desc.slice(0,200):'',created:isValidDate(w.created)?w.created:todayStr(),hidden:w.hidden===true});
  });
  if(ws.length){s.wallets=ws;migrated=false;}
 }
 if(migrated){
  const o=(raw.wallet&&typeof raw.wallet==='object')?Math.round(Number(raw.wallet.opening)):0;
  s.wallets[0].opening=(isFinite(o)&&o>0&&o<=1e13)?o:0;
 }
 /* Ví con: chỉ 1 cấp; ví cha phải tồn tại, khác chính nó và không phải là ví con */
 s.wallets.forEach(w=>{const p=s.wallets.find(x=>x.id===w.parent);if(!p||p.id===w.id||p.parent)w.parent='';else if(p.hidden)w.hidden=true;});
 s.wallets.forEach(w=>{if(w.parent&&s.wallets.some(k=>k.parent===w.id))w.parent='';});
 if(!s.wallets.some(w=>!w.hidden))s.wallets[0].hidden=false;
 const wid=new Set(s.wallets.map(w=>w.id)),firstW=s.wallets.find(w=>!w.hidden).id;
 const ids=new Set();
 const clean=(src,dst,defName)=>{
  src.forEach(e=>{
   if(!e||typeof e!=='object')return;
   const amount=Math.round(Number(e.amount));
   if(!isFinite(amount)||amount<=0||amount>1e13)return;
   if(!isValidDate(e.date))return;
   dst.push({id:cleanId(e.id,ids),amount:amount,name:(typeof e.name==='string'&&e.name.trim())?e.name.trim().slice(0,80):defName,cat:typeof e.cat==='string'?e.cat:'',wallet:wid.has(e.wallet)?e.wallet:firstW,date:e.date,time:/^\d{2}:\d{2}$/.test(e.time)?e.time:'00:00',note:typeof e.note==='string'?e.note.slice(0,300):''});
  });
 };
 if(Array.isArray(raw.expenses))clean(raw.expenses,s.expenses,'Khoản chi');
 if(Array.isArray(raw.incomes))clean(raw.incomes,s.incomes,'Khoản thu');
 if(Array.isArray(raw.transfers)){
  raw.transfers.forEach(t=>{
   if(!t||typeof t!=='object')return;
   const amount=Math.round(Number(t.amount));
   if(!isFinite(amount)||amount<=0||amount>1e13||!isValidDate(t.date))return;
   if(!wid.has(t.from)||!wid.has(t.to)||t.from===t.to)return;
   s.transfers.push({id:cleanId(t.id,ids),from:t.from,to:t.to,amount:amount,date:t.date,time:/^\d{2}:\d{2}$/.test(t.time)?t.time:'00:00',note:typeof t.note==='string'?t.note.slice(0,300):''});
  });
 }
 if(Array.isArray(raw.groups)){
  const seenG=new Set();
  raw.groups.forEach(g=>{
   if(!g||typeof g.name!=='string'||!g.name.trim())return;
   const ms=[];(Array.isArray(g.members)?g.members:[]).forEach(m=>{if(wid.has(m)&&ms.indexOf(m)<0)ms.push(m);});
   s.groups.push({id:cleanId(g.id,seenG),name:g.name.trim().slice(0,40),icon:(typeof g.icon==='string'&&g.icon.trim())?g.icon.trim().slice(0,8):'🔗',color:/^#[0-9a-f]{6}$/i.test(g.color)?g.color:'#4f6df5',members:ms});
  });
 }
 if(migrated){const ds=s.expenses.concat(s.incomes).map(e=>e.date).sort();if(ds.length)s.wallets[0].created=ds[0];}
 if(raw.budgets&&typeof raw.budgets==='object'){
  PERIODS.forEach(p=>{const v=Math.round(Number(raw.budgets[p.k]));s.budgets[p.k]=(isFinite(v)&&v>0)?v:0;});
 }
 if(raw.wallet&&typeof raw.wallet==='object'){
  if(raw.wallet.low!==undefined&&raw.wallet.low!==null){const l=Math.round(Number(raw.wallet.low));s.wallet.low=(isFinite(l)&&l>=0&&l<=1e13)?l:100000;}
  s.wallet.configured=raw.wallet.configured===true;
 }
 if(['light','dark','auto'].indexOf(raw.theme)>=0)s.theme=raw.theme;
 return s;
}

/* Số dư của một tập ví = số dư ban đầu + thu - chi + chuyển đến - chuyển đi (tính tới ngày toDate nếu có).
   Chuyển tiền giữa hai ví cùng tập tự triệt tiêu nên không bao giờ nhân đôi tài sản. */
function balOf(ids,toDate){
 const S=new Set(ids);let b=0;
 state.wallets.forEach(w=>{if(S.has(w.id))b+=w.opening;});
 state.incomes.forEach(e=>{if(S.has(e.wallet)&&(!toDate||e.date<=toDate))b+=e.amount;});
 state.expenses.forEach(e=>{if(S.has(e.wallet)&&(!toDate||e.date<=toDate))b-=e.amount;});
 state.transfers.forEach(t=>{if(toDate&&t.date>toDate)return;if(S.has(t.to))b+=t.amount;if(S.has(t.from))b-=t.amount;});
 return b;
}

function periodRange(mode,a){
 if(mode==='day')return [a,a];
 if(mode==='week'){const ws=weekStart(a);return [ws,addDays(ws,6)];}
 if(mode==='month'){const y=+a.slice(0,4),m=+a.slice(5,7);return [y+'-'+pad(m)+'-01',y+'-'+pad(m)+'-'+pad(daysInMonth(y,m))];}
 if(mode==='year'){const y=a.slice(0,4);return [y+'-01-01',y+'-12-31'];}
 return null;
}
function rangeOf(st){
 if(st.mode==='custom'){
  let f=isValidDate(st.from)?st.from:todayStr(),t=isValidDate(st.to)?st.to:todayStr();
  if(f>t){const x=f;f=t;t=x;}
  return [f,t];
 }
 return periodRange(st.mode,st.anchor);
}
function periodLabel(mode,a){
 if(mode==='day')return WD[parseYmd(a).getDay()]+', '+fmtDate(a);
 if(mode==='week'){const r=periodRange('week',a);return 'Tuần '+fmtDM(r[0])+' – '+fmtDate(r[1]);}
 if(mode==='month')return 'Tháng '+(+a.slice(5,7))+'/'+a.slice(0,4);
 return 'Năm '+a.slice(0,4);
}
function rangeLabel(st){
 if(st.mode==='custom'){const r=rangeOf(st);return 'Từ '+fmtDate(r[0])+' đến '+fmtDate(r[1]);}
 return periodLabel(st.mode,st.anchor);
}
function shiftDate(mode,a,dir){
 if(mode==='day')return addDays(a,dir);
 if(mode==='week')return addDays(a,7*dir);
 if(mode==='month')return ymd(new Date(+a.slice(0,4),+a.slice(5,7)-1+dir,1));
 return ymd(new Date(+a.slice(0,4)+dir,0,1));
}
function niceRange(lo,hi){
 lo=Math.min(0,lo);hi=Math.max(0,hi);
 if(hi-lo<=0)return {min:0,max:100000,step:25000};
 const rough=(hi-lo)/4,p=Math.pow(10,Math.floor(Math.log10(rough)));
 let step=p*10;
 for(const c of [1,2,2.5,5,10]){if(c*p>=rough){step=c*p;break;}}
 return {min:Math.floor(lo/step)*step,max:Math.ceil(hi/step)*step,step:step};
}

let gidc=0;
function niceScale(v){
 v=Math.max(v,1000);
 if(!(v>1000)&&v<=1000)return {max:100000,step:25000};
 const rough=v/4,p=Math.pow(10,Math.floor(Math.log10(rough)));
 let step=p*10;
 for(const c of [1,2,2.5,5,10]){if(c*p>=rough){step=c*p;break;}}
 return {max:step*4,step:step};
}
function chartBase(el,items,o){
 const W=Math.max(el.clientWidth||320,220),H=o.height||230;
 const maxV=Math.max.apply(null,[0].concat(items.map(i=>i.value)));
 const sc=maxV<=0?{max:100000,step:25000}:niceScale(maxV);
 const pl=Math.max(34,fmtShort(sc.max).length*7+10),pr=12,pt=14,pb=28;
 const iw=W-pl-pr,ih=H-pt-pb;
 let grid='';
 for(let k=0;k<=4;k++){
  const v=sc.step*k,y=pt+ih-(v/sc.max)*ih;
  grid+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text x="'+(pl-6)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+fmtShort(v)+'</text>';
 }
 return {W:W,H:H,max:sc.max,pl:pl,pr:pr,pt:pt,pb:pb,iw:iw,ih:ih,grid:grid,n:items.length};
}
function barChart(el,items,o){
 o=o||{};
 const c=chartBase(el,items,o),n=c.n,cw=c.iw/n,bw=Math.min(cw*0.62,38);
 const every=Math.ceil(n/Math.max(1,Math.floor(c.iw/30)));
 let g='',lab='';
 items.forEach((it,i)=>{
  const x=c.pl+cw*i+(cw-bw)/2;
  let bh=it.value/c.max*c.ih;if(it.value>0&&bh<2)bh=2;
  const y=c.pt+c.ih-bh;
  g+='<g class="col" data-i="'+i+'"><rect x="'+(c.pl+cw*i).toFixed(1)+'" y="'+c.pt+'" width="'+cw.toFixed(1)+'" height="'+c.ih+'" fill="transparent"/><rect class="bar'+(it.hl?' hl':'')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="4"/><title>'+esc(it.title||it.label)+': '+fmt(it.value)+'</title></g>';
  if(i%every===0)lab+='<text x="'+(c.pl+cw*i+cw/2).toFixed(1)+'" y="'+(c.H-9)+'" text-anchor="middle">'+esc(it.label)+'</text>';
 });
 el.innerHTML='<svg viewBox="0 0 '+c.W+' '+c.H+'" role="img"><g class="grid">'+c.grid+'</g>'+g+lab+'</svg>';
 el.onclick=ev=>{const t=ev.target.closest('[data-i]');if(t&&o.onClick)o.onClick(items[+t.dataset.i]);};
}
function lineChart(el,items,o){
 o=o||{};
 const c=chartBase(el,items,o),n=c.n;
 const X=i=>n===1?c.pl+c.iw/2:c.pl+8+(c.iw-16)*i/(n-1);
 const Y=v=>c.pt+c.ih-(v/c.max)*c.ih;
 const pts=items.map((it,i)=>[X(i),Y(it.value)]);
 const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 const base=c.pt+c.ih;
 const area=line+' L'+pts[n-1][0].toFixed(1)+' '+base+' L'+pts[0][0].toFixed(1)+' '+base+' Z';
 const gid='lg'+(++gidc),cw=c.iw/n,r=n>20?2.5:4;
 const every=Math.ceil(n/Math.max(1,Math.floor(c.iw/40)));
 let g='',lab='';
 items.forEach((it,i)=>{
  g+='<g class="col" data-i="'+i+'"><rect x="'+(X(i)-cw/2).toFixed(1)+'" y="'+c.pt+'" width="'+cw.toFixed(1)+'" height="'+c.ih+'" fill="transparent"/><circle class="dot" cx="'+pts[i][0].toFixed(1)+'" cy="'+pts[i][1].toFixed(1)+'" r="'+r+'"/><title>'+esc(it.title||it.label)+': '+fmt(it.value)+'</title></g>';
  if(i%every===0)lab+='<text x="'+X(i).toFixed(1)+'" y="'+(c.H-9)+'" text-anchor="middle">'+esc(it.label)+'</text>';
 });
 el.innerHTML='<svg viewBox="0 0 '+c.W+' '+c.H+'" role="img"><defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--primary);stop-opacity:.3"/><stop offset="1" style="stop-color:var(--primary);stop-opacity:0"/></linearGradient></defs><g class="grid">'+c.grid+'</g><path d="'+area+'" fill="url(#'+gid+')"/><path class="line" d="'+line+'"/>'+g+lab+'</svg>';
 el.onclick=ev=>{const t=ev.target.closest('[data-i]');if(t&&o.onClick)o.onClick(items[+t.dataset.i]);};

function donut(el,items,onClick){

function bindMoney(inp){

  const pos=inp.selectionStart||0;
  const before=inp.value.slice(0,pos).replace(/\D/g,'').length;
  const digits=inp.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'').slice(0,13);
  const f=digits?digits.replace(/\B(?=(\d{3})+(?!\d))/g,'.'):'';
  inp.value=f;
  let cnt=0,np=0;
  while(np<f.length&&cnt<before){if(/\d/.test(f[np]))cnt++;np++;}
  try{inp.setSelectionRange(np,np);}catch(e){}
 });
}

  else if(h.cat&&e.cat!==h.cat)return false;
  if(from&&e.date<from)return false;if(to&&e.date>to)return false;

 });
 const s=h.sort;

/* --- Biểu đồ (hỗ trợ số âm) --- */
function wBase(el,lo,hi){
 const W=Math.max(el.clientWidth||320,220),H=230,sc=niceRange(lo,hi);
 const n=Math.round((sc.max-sc.min)/sc.step),labs=[];
 for(let i=0;i<=n;i++)labs.push(sc.min+i*sc.step);
 const pl=Math.max(34,Math.max.apply(null,labs.map(v=>fmtShort(v).length))*7+10),pr=12,pt=14,pb=28;
 const iw=W-pl-pr,ih=H-pt-pb,Y=v=>pt+ih-((v-sc.min)/(sc.max-sc.min))*ih;
 let grid='';
 labs.forEach(v=>{const y=Y(v);grid+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text x="'+(pl-6)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+fmtShort(v)+'</text>';});
 return {W:W,H:H,pl:pl,pr:pr,pt:pt,pb:pb,iw:iw,ih:ih,Y:Y,grid:grid,sc:sc};
}
function walletBars(el,items,onClick){
 let top=0;items.forEach(i=>{top=Math.max(top,i.inV,i.outV);});
 const c=wBase(el,0,top),n=items.length,cw=c.iw/n,gw=Math.min(cw*0.82,46),bw=Math.max(gw/2-1,1);
 const every=Math.ceil(n/Math.max(1,Math.floor(c.iw/30)));
 const hOf=v=>{let h=c.Y(0)-c.Y(v);if(v>0&&h<2)h=2;return h;};
 let g='',lab='';
 items.forEach((it,i)=>{
  const x0=c.pl+cw*i+(cw-gw)/2,hi=hOf(it.inV),ho=hOf(it.outV);
  g+='<g class="col" data-i="'+i+'"><rect x="'+(c.pl+cw*i).toFixed(1)+'" y="'+c.pt+'" width="'+cw.toFixed(1)+'" height="'+c.ih+'" fill="transparent"/><rect class="bar in" x="'+x0.toFixed(1)+'" y="'+(c.Y(0)-hi).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hi.toFixed(1)+'" rx="3"/><rect class="bar out" x="'+(x0+bw+2).toFixed(1)+'" y="'+(c.Y(0)-ho).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+ho.toFixed(1)+'" rx="3"/><title>'+esc(it.title)+' · Thu '+fmt(it.inV)+' · Chi '+fmt(it.outV)+'</title></g>';
  if(i%every===0)lab+='<text x="'+(c.pl+cw*i+cw/2).toFixed(1)+'" y="'+(c.H-9)+'" text-anchor="middle">'+esc(it.label)+'</text>';
 });
 el.innerHTML='<svg viewBox="0 0 '+c.W+' '+c.H+'" role="img" aria-label="Biểu đồ so sánh thu và chi"><g class="grid">'+c.grid+'</g>'+g+lab+'</svg>';

function walletCompare(el,items,onClick){
 const vals=items.map(i=>i.value).concat([0]);
 const c=wBase(el,Math.min.apply(null,vals),Math.max.apply(null,vals)),n=items.length,cw=c.iw/n,bw=Math.min(cw*0.6,46);
 const every=Math.ceil(n/Math.max(1,Math.floor(c.iw/56)));
 let g='',lab='';

  const x=c.pl+cw*i+(cw-bw)/2,y0=c.Y(0),y1=c.Y(it.value),top=Math.min(y0,y1),h=Math.max(Math.abs(y1-y0),it.value?2:0);
  g+='<g class="col" data-i="'+i+'"><rect x="'+(c.pl+cw*i).toFixed(1)+'" y="'+c.pt+'" width="'+cw.toFixed(1)+'" height="'+c.ih+'" fill="transparent"/><rect class="bar" style="fill:'+it.color+'" x="'+x.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="4"/><title>'+esc(it.label)+': '+fmt(it.value)+'</title></g>';
  if(i%every===0)lab+='<text x="'+(c.pl+cw*i+cw/2).toFixed(1)+'" y="'+(c.H-9)+'" text-anchor="middle">'+esc(it.label.length>9?it.label.slice(0,8)+'…':it.label)+'</text>';
 });

function walletBuckets(mode,a){
 const out=[];
 if(mode==='week'){
  const ws=weekStart(a);
  ['T2','T3','T4','T5','T6','T7','CN'].forEach((n,i)=>{const d=addDays(ws,i);out.push({label:n,title:WD[parseYmd(d).getDay()]+' '+fmtDate(d),from:d,to:d});});
 }else if(mode==='month'){
  const y=+a.slice(0,4),m=+a.slice(5,7),n=daysInMonth(y,m);
  for(let i=1;i<=n;i++){const d=y+'-'+pad(m)+'-'+pad(i);out.push({label:String(i),title:'Ngày '+fmtDate(d),from:d,to:d});}
 }else{
  const y=+a.slice(0,4);
  for(let m=1;m<=12;m++)out.push({label:'T'+m,title:'Tháng '+m+'/'+y,from:y+'-'+pad(m)+'-01',to:y+'-'+pad(m)+'-'+pad(daysInMonth(y,m))});
 }
 return out;
}
function bucketsOf(st,rg){
 if(st.mode!=='custom')return walletBuckets(st.mode,st.anchor);
 const out=[],days=diffDays(rg[0],rg[1])+1;
 if(days<=92){
  for(let i=0;i<days;i++){const d=addDays(rg[0],i);out.push({label:fmtDM(d),title:'Ngày '+fmtDate(d),from:d,to:d});}
 }else{
  let y=+rg[0].slice(0,4),m=+rg[0].slice(5,7);
  for(let guard=0;guard<2000;guard++){
   const ms=y+'-'+pad(m)+'-01',me=y+'-'+pad(m)+'-'+pad(daysInMonth(y,m));
   out.push({label:m+'/'+String(y).slice(2),title:'Tháng '+m+'/'+y,from:ms<rg[0]?rg[0]:ms,to:me>rg[1]?rg[1]:me});
   if(me>=rg[1])break;
   m++;if(m>12){m=1;y++;}
  }
 }
 return out;
}

function doDeleteWallet(id,mode,target){

  state.transfers=state.transfers.filter(t=>!((t.from===id&&t.to===target)||(t.from===target&&t.to===id)));
  state.transfers.forEach(t=>{if(t.from===id)t.from=target;if(t.to===id)t.to=target;});
  state.groups.forEach(g=>{const i=g.members.indexOf(id);if(i>=0){if(g.members.indexOf(target)>=0)g.members.splice(i,1);else g.members[i]=target;}});
  msg='Đã xóa ví "'+w.name+'"; giao dịch được chuyển sang "'+T.name+'"';
 }else{
  state.expenses=state.expenses.filter(e=>e.wallet!==id);
  state.incomes=state.incomes.filter(e=>e.wallet!==id);
  state.transfers=state.transfers.filter(t=>t.from!==id&&t.to!==id);
  state.groups.forEach(g=>{g.members=g.members.filter(m=>m!==id);});

 state.wallets=state.wallets.filter(x=>x.id!==id);
 if(!state.wallets.some(x=>!x.hidden))state.wallets[0].hidden=false;
 if(ui.lastWallet===id)ui.lastWallet=null;
 ui.wallet.scope=null;
 commit();toast(msg);
}

  '<div class="panel" style="margin-top:0"><h3>Giao diện</h3><div class="seg">'+[['light','☀️ Sáng'],['dark','🌙 Tối'],['auto','Tự động']].map(x=>'<button class="'+(state.theme===x[0]?'on':'')+'" data-act="theme" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div></div>'+
  '<div class="panel"><h3>Ngân sách chi tiêu</h3><p class="muted small" style="margin:-4px 0 0">Để trống hoặc 0 nếu không đặt. Cảnh báo khi đạt 80% và khi vượt ngân sách. Tuần tính từ Thứ 2 đến Chủ nhật.</p><form id="budget-form">'+
  PERIODS.map(p=>'<label class="lab" for="b-'+p.k+'">Ngân sách mỗi '+p.n+'</label><div class="money"><input id="b-'+p.k+'" inputmode="numeric" autocomplete="off" placeholder="Không giới hạn"><span>đ</span></div>').join('')+
  '<div class="btns"><button class="btn primary" type="submit">Lưu ngân sách</button></div></form></div>'+
  '<div class="panel"><div class="ph"><h3>Ví</h3><button class="btn primary" style="min-height:38px" data-act="goto-wallet">Quản lý ví</button></div>'+
  '<div class="row"><div class="grow"><b>Số ví</b></div><b>'+state.wallets.length+'</b></div>'+
  '<div class="row"><div class="grow"><b>Nhóm ví</b></div><b>'+state.groups.length+'</b></div>'+
  '<div class="row"><div class="grow"><b>Cảnh báo số dư thấp</b></div><b>'+(state.wallet.low>0?'≤ '+fmt(state.wallet.low):'Tắt')+'</b></div>'+
  '<div class="btns"><button class="btn" data-act="w-setup">Đặt ngưỡng cảnh báo</button></div></div>'+
  '<div class="panel"><div class="ph"><h3>Danh mục chi</h3><button class="btn primary" style="min-height:38px" data-act="cat-add" data-kind="exp">+ Thêm</button></div>'+catRows(state.categories,'exp',counts)+'</div>'+
  '<div class="panel"><div class="ph"><h3>Danh mục thu</h3><button class="btn primary" style="min-height:38px" data-act="cat-add" data-kind="inc">+ Thêm</button></div>'+catRows(state.incomeCats,'inc',icounts)+'</div>'+
  '<div class="panel"><div class="ph"><h3>Loại ví</h3><button class="btn primary" style="min-height:38px" data-act="cat-add" data-kind="wt">+ Thêm</button></div>'+catRows(state.walletTypes,'wt',tcounts)+'</div>'+
  '<div class="panel"><h3>Dữ liệu</h3><p class="muted small" style="margin:-4px 0 12px">Hiện có <b>'+state.expenses.length+'</b> khoản chi, <b>'+state.incomes.length+'</b> khoản thu, <b>'+state.transfers.length+'</b> lần chuyển tiền, <b>'+state.wallets.length+'</b> ví và <b>'+(state.categories.length+state.incomeCats.length)+'</b> danh mục, được lưu tự động trên trình duyệt của thiết bị này. Hãy sao lưu định kỳ để chuyển sang thiết bị khác hoặc phòng khi xóa dữ liệu trình duyệt.</p>'+
  '<div class="dgrid"><button class="btn" data-act="export-xls">Xuất Excel (.xls)</button><button class="btn" data-act="export-csv">Xuất CSV</button><button class="btn" data-act="export-json">Sao lưu (JSON)</button><button class="btn" data-act="import">Khôi phục từ JSON</button><button class="btn full" data-act="export-wallet">Xuất giao dịch Ví (thu &amp; chi, CSV)</button><button class="btn ghost-danger full" data-act="wipe">Xóa toàn bộ dữ liệu</button></div></div>';
 PERIODS.forEach(p=>{const i=$('#b-'+p.k,el);bindMoney(i);i.value=state.budgets[p.k]?num(state.budgets[p.k]):'';});
 $('#budget-form',el).addEventListener('submit',ev=>{
  ev.preventDefault();
  PERIODS.forEach(p=>{state.budgets[p.k]=moneyVal($('#b-'+p.k,el).value);});
  save();toast('Đã lưu ngân sách');
 });
}
function download(name,mime,content){
 const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);a.click();
 setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},1500);
}
function exportRows(){return sortedNew().map(e=>[fmtDate(e.date),e.time,e.name,catOf(e.cat).name,e.amount,e.note]);}
const HEAD=['Ngày','Giờ','Tên khoản chi','Danh mục','Số tiền (đ)','Ghi chú'];
function exportCsv(){
 if(!state.expenses.length)return toast('Chưa có dữ liệu để xuất');
 const safe=v=>{let s=String(v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
 const lines=[HEAD.map(safe).join(',')].concat(exportRows().map(r=>[safe(r[0]),safe(r[1]),safe(r[2]),safe(r[3]),r[4],safe(r[5])].join(',')));
 download('chi-tieu-'+todayStr()+'.csv','text/csv;charset=utf-8','\ufeff'+lines.join('\r\n'));
 toast('Đã xuất tệp CSV');
}
function exportXls(){
 if(!state.expenses.length)return toast('Chưa có dữ liệu để xuất');
 const t='style="mso-number-format:\'\\@\'"';
 const rows=exportRows().map(r=>'<tr><td '+t+'>'+esc(r[0])+'</td><td '+t+'>'+esc(r[1])+'</td><td '+t+'>'+esc(r[2])+'</td><td '+t+'>'+esc(r[3])+'</td><td>'+r[4]+'</td><td '+t+'>'+esc(r[5])+'</td></tr>').join('');
 const html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body><table border="1"><tr>'+HEAD.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+rows+'</table></body></html>';
 download('chi-tieu-'+todayStr()+'.xls','application/vnd.ms-excel;charset=utf-8','\ufeff'+html);
 toast('Đã xuất tệp Excel');
}
function exportJson(){
 const data={app:'chi-tieu-ca-nhan',version:3,exportedAt:new Date().toISOString(),expenses:state.expenses,categories:state.categories,incomes:state.incomes,incomeCats:state.incomeCats,wallets:state.wallets,walletTypes:state.walletTypes,groups:state.groups,transfers:state.transfers,wallet:state.wallet,budgets:state.budgets,theme:state.theme};
 download('chi-tieu-sao-luu-'+todayStr()+'.json','application/json',JSON.stringify(data,null,2));
 toast('Đã tạo tệp sao lưu');
}
function importJson(file){
 const rd=new FileReader();
 rd.onerror=()=>toast('Không đọc được tệp.','bad');
 rd.onload=async()=>{
  let next,hasWallet=false;
  try{
   const raw=JSON.parse(String(rd.result).replace(/^\ufeff/,''));
   if(!raw||typeof raw!=='object'||!(Array.isArray(raw.expenses)||Array.isArray(raw.incomes)))throw new Error('Tệp không đúng định dạng sao lưu.');
   next=sanitize(raw);
   hasWallet=['incomes','wallet','incomeCats','wallets','groups','transfers','walletTypes'].some(k=>k in raw);
   if(!hasWallet){
    ['incomes','incomeCats','wallet','wallets','walletTypes','groups','transfers'].forEach(k=>{next[k]=JSON.parse(JSON.stringify(state[k]));});
    next.expenses.forEach(e=>{if(!next.wallets.some(w=>w.id===e.wallet))e.wallet=next.wallets.find(w=>!w.hidden).id;});
   }
  }catch(err){toast('Không khôi phục được: '+(err.message||'tệp lỗi'),'bad');return;}
  const ok=await confirmBox({title:'Khôi phục dữ liệu?',msg:'Dữ liệu hiện tại ('+state.expenses.length+' chi, '+state.incomes.length+' thu, '+state.wallets.length+' ví) sẽ được thay bằng bản sao lưu ('+next.expenses.length+' chi, '+next.incomes.length+' thu, '+next.transfers.length+' chuyển tiền, '+next.wallets.length+' ví, '+next.groups.length+' nhóm).'+(hasWallet?'':' Bản sao lưu cũ không có dữ liệu Ví nên các ví, khoản thu, chuyển tiền và nhóm ví hiện tại được giữ nguyên.'),ok:'Khôi phục',danger:true});
  if(!ok)return;
  next.theme=state.theme;state=next;commit();toast('Đã khôi phục '+next.expenses.length+' giao dịch');
 };
 rd.readAsText(file,'utf-8');
}
async function wipeAll(){
 const ok=await confirmBox({title:'Xóa toàn bộ dữ liệu?',msg:'Tất cả '+state.expenses.length+' khoản chi, '+state.incomes.length+' khoản thu, '+state.transfers.length+' lần chuyển tiền, '+state.wallets.length+' ví, nhóm ví, danh mục tùy chỉnh và ngân sách sẽ bị xóa vĩnh viễn. Nên sao lưu trước khi xóa.',ok:'Xóa tất cả',danger:true});
 if(!ok)return;
 const th=state.theme;state=defaults();state.theme=th;
 ui.hist={q:'',cat:'',from:'',to:'',sort:'date-desc',limit:100};
 commit();toast('Đã xóa toàn bộ dữ liệu');
}

/* ================= Giao diện sáng/tối ================= */
function isDark(){return state.theme==='dark'||(state.theme==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);}
function applyTheme(){
 const d=isDark();
 document.documentElement.setAttribute('data-theme',d?'dark':'light');
 const m=$('meta[name=theme-color]');if(m)m.content=d?'#171e2e':'#ffffff';
 const b=$('#theme-btn');if(b)b.innerHTML=icon(d?'sun':'moon',20);
}

/* ================= Điều hướng & render ================= */
function render(){
 const y=window.scrollY,el=$('#view'),v=ui.view;
 $$('#nav [data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
 if(v==='overview')renderOverview(el);
 else if(v==='history')renderHistory(el);
 else if(v==='stats')renderStats(el);
 else if(v==='wallet')renderWallet(el);
 else renderSettings(el);
 window.scrollTo(0,y);
}
function commit(){save();render();renderDetail();}
function navigate(v){
 if(ui.view===v){window.scrollTo({top:0,behavior:'smooth'});return;}
 if(location.hash!=='#'+v)location.hash=v;else onHash();
}
function onHash(){
 const v=location.hash.slice(1);
 ui.view=VIEWS.indexOf(v)>=0?v:'overview';
 render();window.scrollTo(0,0);
}

/* ================= Sự kiện ================= */
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-act]');if(!a)return;
 const act=a.dataset.act,id=a.dataset.id,v=a.dataset.v;
 switch(act){
  case 'nav':navigate(a.dataset.view);break;
  case 'add':openExpenseForm();break;
  case 'edit':openExpenseForm(id);break;
  case 'del':deleteFlow(id);break;
  case 'close':closeModal();break;
  case 'goto-settings':navigate('settings');break;
  case 'goto-history':navigate('history');break;
  case 'theme-toggle':state.theme=isDark()?'light':'dark';save();applyTheme();if(ui.view==='settings')render();break;
  case 'theme':state.theme=v;save();applyTheme();render();break;
  case 'h-more':ui.hist.limit+=100;renderHistoryList();break;
  case 'h-preset':histPreset(v);break;
  case 's-mode':ui.stat.mode=v;render();break;
  case 's-chart':ui.stat.chart=v;render();break;
  case 's-prev':shiftAnchor(-1);render();break;
  case 's-next':shiftAnchor(1);render();break;
  case 's-today':ui.stat.anchor=todayStr();render();break;
  case 'cat-add':openCatForm(null,a.dataset.kind);break;
  case 'cat-edit':openCatForm(id,a.dataset.kind);break;
  case 'cat-del':deleteCat(id,a.dataset.kind);break;
  case 'goto-wallet':navigate('wallet');break;
  case 'w-tab':ui.wallet.tab=v;render();break;
  case 'w-mode':ui.wallet.mode=v;setScope(v==='all'?{kind:'all'}:null);break;
  case 'w-open':ui.wallet.mode='each';setScope({kind:'wallet',id:id});break;
  case 'g-open':ui.wallet.mode='each';setScope({kind:'group',id:id});break;
  case 'w-back':setScope(null);break;
  case 'w-new':openWalletForm();break;
  case 'w-edit':openWalletForm(id);break;
  case 'w-newkid':openWalletForm(null,id);break;
  case 'w-hide':toggleHide(id);break;
  case 'w-del':deleteWalletFlow(id);break;
  case 'g-new':openGroupForm();break;
  case 'g-edit':openGroupForm(id);break;
  case 'g-del':deleteGroup(id);break;
  case 'tf-new':openTransferForm();break;
  case 'w-add-in':openTxForm('in');break;
  case 'w-add-out':openTxForm('out');break;
  case 'w-setup':openWalletSetup();break;
  case 'tx-edit':{const f=txFind(id);if(f){if(f.kind==='tf')openTransferForm(id);else openTxForm(f.kind,id);}break;}
  case 'tx-del':txDelete(id);break;
  case 'w-type':ui.wallet.f.type=v;ui.wallet.f.cat='';ui.wallet.f.limit=100;render();break;
  case 'w-more':ui.wallet.f.limit+=100;renderWalletList();break;
  case 'wh-mode':{const f=ui.wallet.f;f.mode=v;f.limit=100;f.anchor=todayStr();if(v==='custom'&&!(isValidDate(f.from)&&isValidDate(f.to))){f.from=monthStart();f.to=todayStr();}render();break;}
  case 'wh-prev':ui.wallet.f.anchor=shiftDate(ui.wallet.f.mode,ui.wallet.f.anchor,-1);ui.wallet.f.limit=100;render();break;
  case 'wh-next':ui.wallet.f.anchor=shiftDate(ui.wallet.f.mode,ui.wallet.f.anchor,1);ui.wallet.f.limit=100;render();break;
  case 'wh-today':{const f=ui.wallet.f;f.anchor=todayStr();if(f.mode==='custom'){f.from=monthStart();f.to=todayStr();}f.limit=100;render();break;}
  case 'ws-mode':{const s=ui.wallet.stat;s.mode=v;if(v==='custom'&&!(isValidDate(s.from)&&isValidDate(s.to))){s.from=monthStart();s.to=todayStr();}render();break;}
  case 'ws-prev':ui.wallet.stat.anchor=shiftDate(ui.wallet.stat.mode,ui.wallet.stat.anchor,-1);render();break;
  case 'ws-next':ui.wallet.stat.anchor=shiftDate(ui.wallet.stat.mode,ui.wallet.stat.anchor,1);render();break;
  case 'ws-today':{const s=ui.wallet.stat;s.anchor=todayStr();if(s.mode==='custom'){s.from=monthStart();s.to=todayStr();}render();break;}
  case 'export-wallet':exportWalletCsv();break;
  case 'export-csv':exportCsv();break;
  case 'export-xls':exportXls();break;
  case 'export-json':exportJson();break;
  case 'import':$('#file-import').click();break;
  case 'wipe':wipeAll();break;
 }
});
document.addEventListener('input',e=>{
 if(e.target.id==='h-q'){ui.hist.q=e.target.value;ui.hist.limit=100;renderHistoryList();}
 else if(e.target.id==='w-q'){ui.wallet.f.q=e.target.value;ui.wallet.f.limit=100;renderWalletList();}
});
document.addEventListener('change',e=>{
 const t=e.target,id=t.id,h=ui.hist,s=ui.stat;
 if(id==='h-cat'){h.cat=t.value;h.limit=100;renderHistoryList();}
 else if(id==='h-sort'){h.sort=t.value;h.limit=100;renderHistoryList();}
 else if(id==='h-from'){h.from=t.value;h.limit=100;renderHistoryList();}
 else if(id==='h-to'){h.to=t.value;h.limit=100;renderHistoryList();}
 else if(id==='s-date'){if(isValidDate(t.value)){s.anchor=t.value;render();}}
 else if(id==='s-m'||id==='s-y'){
  const y=$('#s-y')?+$('#s-y').value:+s.anchor.slice(0,4);
  const m=(s.mode==='month'&&$('#s-m'))?+$('#s-m').value:1;
  s.anchor=y+'-'+pad(m)+'-01';render();
 }
 else if(id==='w-cat'){ui.wallet.f.cat=t.value;ui.wallet.f.limit=100;renderWalletList();}
 else if(id==='w-wal'){ui.wallet.f.wal=t.value;ui.wallet.f.limit=100;renderWalletList();}
 else if(/^(wh|ws)-(date|m|y|from|to)$/.test(id)){
  const p=id.slice(0,2),k=id.slice(3),st=p==='wh'?ui.wallet.f:ui.wallet.stat;
  if(k==='date'){if(!isValidDate(t.value))return;st.anchor=t.value;}
  else if(k==='from'||k==='to'){
   if(!isValidDate(t.value))return;
   st[k]=t.value;if(!isValidDate(st.from))st.from=monthStart();if(!isValidDate(st.to))st.to=todayStr();
  }else{
   const y=$('#'+p+'-y')?+$('#'+p+'-y').value:+st.anchor.slice(0,4);
   const m=(st.mode==='month'&&$('#'+p+'-m'))?+$('#'+p+'-m').value:1;
   st.anchor=y+'-'+pad(m)+'-01';
  }
  if(p==='wh')st.limit=100;
  render();
 }
 else if(id==='file-import'){const f=t.files&&t.files[0];t.value='';if(f)importJson(f);}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&modalStack.length)closeModal();
 else if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.dataset.act){e.preventDefault();e.target.click();}
});
window.addEventListener('hashchange',onHash);
let lastW=window.innerWidth,rT;
window.addEventListener('resize',()=>{
 clearTimeout(rT);
 rT=setTimeout(()=>{if(window.innerWidth!==lastW){lastW=window.innerWidth;if(ui.view==='overview'||ui.view==='stats'||ui.view==='wallet')render();}},150);
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(ui.view==='overview'||ui.view==='stats'||ui.view==='wallet')&&!modalStack.length)render();});
window.addEventListener('storage',e=>{if(e.key===KEY){state=load();applyTheme();render();renderDetail();}});
if(window.matchMedia){try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.theme==='auto')applyTheme();});}catch(e){}}

/* ================= Khởi động ================= */
$('#nav').innerHTML=[['overview','home','Tổng quan'],['wallet','wallet','Ví'],['add','plus','Thêm chi<span class="ext"> tiêu</span>'],['history','list','Lịch sử'],['stats','chart','Thống kê'],['settings','sliders','Cài đặt']].map(x=>
 x[0]==='add'?'<button class="add" data-act="add" aria-label="Thêm chi tiêu"><span class="plus">'+icon('plus',24)+'</span><span class="lbl">'+x[2]+'</span></button>'
 :'<button data-act="nav" data-view="'+x[0]+'">'+icon(x[1],22)+'<span class="lbl">'+x[2]+'</span></button>').join('');
applyTheme();
if(!storageOk)setTimeout(()=>toast('Trình duyệt đang chặn lưu trữ. Hãy sao lưu dữ liệu thường xuyên.','bad'),400);
onHash();
})();
</script>
